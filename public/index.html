<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clinic front desk</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 24px; color: #142033; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0 24px; }
    th, td { border: 1px solid #c5d5da; padding: 8px 10px; text-align: left; }
    th { background: #0a585c; color: #fff; }
    form { display: grid; gap: 10px; max-width: 360px; }
    button { width: fit-content; }
  </style>
</head>
<body>
  <h1>Clinic front desk</h1>
  <table>
    <thead><tr><th>Time</th><th>Patient</th><th>Surname</th><th>Action</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <h2>Book an appointment</h2>
  <form id="book">
    <label>Patient name <input name="patientName" required /></label>
    <label>Surname <input name="patientSurname" /></label>
    <label>Time (30-minute slots) <input name="time" type="time" step="1800" required /></label>
    <button type="submit">Book appointment</button>
  </form>
  <script>
    async function load() {
      const res = await fetch("/api/appointments/today");
      const rows = await res.json();
      document.getElementById("rows").innerHTML = rows.map((row) =>
        "<tr><td>" + (row.time || "") + "</td><td>" + (row.patientName || "") + "</td><td>" + (row.patientSurname || row.surname || "") + "</td><td><button data-id='" + row.id + "'>Cancel</button></td></tr>"
      ).join("");
    }
    document.getElementById("rows").addEventListener("click", async (event) => {
      const id = event.target && event.target.dataset && event.target.dataset.id;
      if (!id) return;
      await fetch("/api/appointments/cancel/" + id, { method: "DELETE" });
      load();
    });
    document.getElementById("book").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      await fetch("/api/appointments/book", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      event.target.reset();
      load();
    });
    fetch("/health").then(() => load());
  </script>
</body>
</html>
